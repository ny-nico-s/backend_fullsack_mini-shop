services:
  db:
    image: postgres:16
    container_name: minishop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: minishop
      POSTGRES_USER: minishop
      POSTGRES_PASSWORD: minishop
    ports:
      - "5432:5432"
    volumes:
      - minishop_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minishop -d minishop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minishop_data:
